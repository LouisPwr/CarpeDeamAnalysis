# Basic config File
wdir: "/data/empirical/smk"
sdir: "/data/empirical/readsPool"
sanadir: "data/empirical/results/reads_paired"
rdir: "/data/empirical/results"
adir: ""
refdir: ""

tmp: "/tmp"
sample_file_read: "/data/empirical/sample_ids_emp.txt"

uniref100: "/databases/uniref100_dir/uniref100"
taxdb: "/home/databases/gtdb/gtdb"
rna: "/rnadb/mmseqsSilva/silva"

###############################################################################
#
# Common config values
#
###############################################################################
#Add binary paths
seqkit_bin: "/home/ctools/seqkit-2.2.0/seqkit"
kraken2_bin: "kraken2"
bracken_bin: "bracken"
tadpole_bin: "tadpole.sh"
pileup_bin: "pileup.sh"
mmseqs_bin: "/home/ctools/mmseqs2/build/bin/mmseqs"
carpedeam_bin: "/home/ctools/CarpeDeam/build/bin/carpedeam"
megahit_bin: "/home/ctools/megahit/build/megahit"
megahit_tk_bin: "megahit_toolkit"

spades_bin: "metaspades.py"
penguin_bin: "/native_plass/plass/build/bin/plass"

quast_bin: "metaquast.py"
prodigal_bin: "prodigal"
prokka_bin: "prokka"
bowtie2_bin: "bowtie2"
bowtie2_build_bin: "bowtie2-build"
samtools_bin: "samtools"
dedupe_bin: dedupe.sh
rename_bin: rename.sh
vsearch_bin: vsearch
leehom_bin: "/home/ctools/leehom-1.2.17"


# Program parameters
# Threads
seqkit_threads: 16
extract_threads: 8
threads_16: 16
threads_14: 14
threads_13: 13
threads_4: 4
threads_8: 8
threads_32: 32
threads_64: 64
threads_128: 128

# Rename reads
rename_reads: True
read_minlen: 30
rename_parms: "addunderscore=f overwrite=t"

# carpedeam
carpedeam_threads: 32
carpedeam_config:
  configSafe0: '--unsafe 0'
  configUnsafe0: '--unsafe 1

# PLASS: Assembly reads at protein level
penguin_threads: 32
penguin_config:
  config10: '--remove-tmp-files 1 --split-memory-limit 200G --max-seq-len 10000000 --min-contig-len 500 -e 0.01'

# SPADES: assembly
spades_min_contig_length: 500
spades_threads: 32
spades_config: 
  config10: "--only-assembler"

assm_input_1: ["raw"]
assm_input_2: ["raw"]

# MEGAHIT: assembly
megahit_min_contig_length: 500
megahit_threads: 32
megahit_config: 
  config10: ""